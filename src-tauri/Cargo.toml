[package]
name = "codesetu"
version = "0.1.0"
description = "Bridge code between intranet and internet copies"
authors = ["Mindteck"]
edition = "2021"

[lib]
name = "codesetu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rayon = "1"
jwalk = "0.8"
ignore = "0.4"
globset = "0.4"
toml = "0.8"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
similar = "2"
parking_lot = "0.12"
dirs = "6"
hex = "0.4"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
